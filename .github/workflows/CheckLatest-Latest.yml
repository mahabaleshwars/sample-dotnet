name: "check-latest x 'latest' keyword and channels"

on:
  workflow_dispatch:
  
env:
  DOTNET_MULTILEVEL_LOOKUP: '0'
  DOTNET_NOLOGO: '1'

jobs:
  # ===================================================================
  # Channels that CAN be resolved offline -> must reuse a local SDK.
  #
  # Baseline inventory: 8.0.100, 8.0.412, 9.0.308, 10.0.101
  #   8.0.100  -> feature band 1xx
  #   8.0.412  -> feature band 4xx, highest inside 8.0
  #   9.0.308  -> a middle major
  #   10.0.101 -> the highest overall, so a channel-less 'latest' is provable
  # ===================================================================
  latest-with-resolvable-channel:
    name: 'latest + channel ${{ matrix.label }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - {label: '(none)', channel: '', expected: '10.0.101'}
          - {label: '8.0', channel: '8.0', expected: '8.0.412'}
          - {label: '9.0', channel: '9.0', expected: '9.0.308'}
          - {label: '10.0', channel: '10.0', expected: '10.0.101'}
          - {label: '8.0.1xx', channel: '8.0.1xx', expected: '8.0.100'}
          - {label: '8.0.4xx', channel: '8.0.4xx', expected: '8.0.412'}
          - {label: '9.0.3xx', channel: '9.0.3xx', expected: '9.0.308'}
          - {label: '10.0.1xx', channel: '10.0.1xx', expected: '10.0.101'}
    steps:
      - uses: actions/checkout@v4

      # Runner images ship .NET preinstalled, which would pollute the local
      # inventory and make every assertion below meaningless.
      - name: Isolate the .NET install directory
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dotnet-isolated'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "DOTNET_INSTALL_DIR=$dir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Preinstall the baseline inventory
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: |
            8.0.100
            8.0.412
            9.0.308
            10.0.101

      - name: Verify isolation
        id: before
        shell: pwsh
        run: |
          $sdks = (& dotnet --list-sdks) | ForEach-Object { ($_ -split ' ')[0] } | Sort-Object
          Write-Host "local inventory: $($sdks -join ', ')"
          "count=$($sdks.Count)" | Out-File $env:GITHUB_OUTPUT -Append
          $expected = @('10.0.101','8.0.100','8.0.412','9.0.308') | Sort-Object
          if (Compare-Object $sdks $expected) {
            Write-Host "::error::Isolation failed - expected exactly $($expected -join ', ')"
            exit 1
          }

      - name: Request latest with channel '${{ matrix.channel }}'
        id: run
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: latest
          dotnet-channel: ${{ matrix.channel }}
          check-latest: false

      - name: Assert the channel was honoured with zero downloads
        shell: pwsh
        run: |
          $v = '${{ steps.run.outputs.dotnet-version }}'
          $sdks = (& dotnet --list-sdks) | ForEach-Object { ($_ -split ' ')[0] }
          Write-Host "resolved : '$v'"
          Write-Host "inventory: $($sdks -join ', ')"
          if ($v -ne '${{ matrix.expected }}') {
            Write-Host "::error::Expected '${{ matrix.expected }}' but got '$v'"
            exit 1
          }
          if ($sdks.Count -ne [int]'${{ steps.before.outputs.count }}') {
            Write-Host "::error::An SDK was downloaded - this should have been a pure reuse"
            exit 1
          }
          dotnet --version

  # ===================================================================
  # LTS / STS cannot be mapped to a version without the releases index,
  # so they must ALWAYS fall back online, in every letter case.
  # ===================================================================
  latest-with-lts-sts-always-online:
    name: 'latest + ${{ matrix.channel }} must go online'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        channel: ['LTS', 'STS', 'lts', 'sts', 'Lts', 'Sts']
    steps:
      - uses: actions/checkout@v4
      - name: Isolate the .NET install directory
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dotnet-isolated'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "DOTNET_INSTALL_DIR=$dir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Preinstall a tempting inventory
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: |
            8.0.412
            9.0.308
      - id: run
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: latest
          dotnet-channel: ${{ matrix.channel }}
          check-latest: false
      - shell: pwsh
        run: |
          $v = '${{ steps.run.outputs.dotnet-version }}'
          Write-Host "resolved: '$v'"
          if ($v -in @('8.0.412','9.0.308')) {
            Write-Host "::error::'${{ matrix.channel }}' wrongly reused a local SDK ($v)"
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($v)) {
            Write-Host "::error::No version was resolved"; exit 1
          }
          dotnet --version

  # ===================================================================
  # An invalid channel is a hard error when 'latest' is requested.
  # check-latest:false must NOT turn that into a silent reuse.
  # ===================================================================
  latest-with-invalid-channel-fails:
    name: "invalid channel '${{ matrix.channel }}' must fail"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # uppercase XX is rejected by isValidChannel (the regex is lowercase)
          - {channel: '8.0.1XX'}
          - {channel: '8.0.1Xx'}
          # bare major is not the A.B form
          - {channel: '8'}
          - {channel: '8.0.412'}
          # feature-band channels require major >= 5
          - {channel: '3.1.1xx'}
          # nonsense
          - {channel: 'stable'}
          - {channel: 'current'}
          - {channel: 'LTS.0'}
    steps:
      - uses: actions/checkout@v4
      - name: Isolate the .NET install directory
        shell: bash
        run: |
          dir="$RUNNER_TEMP/dotnet-isolated"
          rm -rf "$dir" && mkdir -p "$dir"
          echo "DOTNET_INSTALL_DIR=$dir" >> "$GITHUB_ENV"
      - name: Make a tempting local SDK available
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with: {dotnet-version: '8.0.412'}
      - id: bad
        continue-on-error: true
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: latest
          dotnet-channel: ${{ matrix.channel }}
          check-latest: false
      - shell: pwsh
        run: |
          if ('${{ steps.bad.outcome }}' -ne 'failure') {
            Write-Host "::error::'${{ matrix.channel }}' was accepted but should have been rejected"
            exit 1
          }
          if ('${{ steps.bad.outputs.dotnet-version }}' -eq '8.0.412') {
            Write-Host "::error::An invalid channel matched a local SDK"; exit 1
          }
          Write-Host "OK - rejected as expected"

  # ===================================================================
  # 'latest' is matched case-insensitively, and so is the channel plumbing.
  # ===================================================================
  latest-keyword-case-insensitivity:
    name: "version '${{ matrix.version }}' + channel '${{ matrix.channel }}'"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {version: 'latest', channel: '', expected: '9.0.308'}
          - {version: 'Latest', channel: '', expected: '9.0.308'}
          - {version: 'LATEST', channel: '', expected: '9.0.308'}
          - {version: 'lAtEsT', channel: '', expected: '9.0.308'}
          - {version: 'latest', channel: '8.0', expected: '8.0.412'}
          - {version: 'Latest', channel: '8.0', expected: '8.0.412'}
          - {version: 'LATEST', channel: '8.0', expected: '8.0.412'}
          # padded input - the installer trims before matching
          - {version: '  latest  ', channel: '8.0', expected: '8.0.412'}
    steps:
      - uses: actions/checkout@v4
      - name: Isolate the .NET install directory
        shell: bash
        run: |
          dir="$RUNNER_TEMP/dotnet-isolated"
          rm -rf "$dir" && mkdir -p "$dir"
          echo "DOTNET_INSTALL_DIR=$dir" >> "$GITHUB_ENV"
      - uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: |
            8.0.412
            9.0.308
      - id: run
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: ${{ matrix.version }}
          dotnet-channel: ${{ matrix.channel }}
          check-latest: false
      - shell: pwsh
        run: |
          $v = '${{ steps.run.outputs.dotnet-version }}'
          Write-Host "resolved: '$v'"
          if ($v -ne '${{ matrix.expected }}') {
            Write-Host "::error::Expected '${{ matrix.expected }}' but got '$v'"
            exit 1
          }

  # ===================================================================
  # 'latest' x dotnet-quality. The quality filter runs BEFORE the channel
  # branch, so preview/daily against a GA-only machine can never reuse.
  # ===================================================================
  latest-with-quality:
    name: 'latest + ${{ matrix.channel || "(none)" }} + quality ${{ matrix.quality }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {quality: 'ga', channel: '', outcome: 'reuse', expected: '9.0.308'}
          - {quality: 'ga', channel: '8.0', outcome: 'reuse', expected: '8.0.412'}
          - {quality: 'ga', channel: '8.0.4xx', outcome: 'reuse', expected: '8.0.412'}
          - {quality: 'ga', channel: 'LTS', outcome: 'online', expected: ''}
          - {quality: 'preview', channel: '', outcome: 'online', expected: ''}
          - {quality: 'preview', channel: '8.0', outcome: 'online', expected: ''}
          - {quality: 'preview', channel: 'STS', outcome: 'online', expected: ''}
          - {quality: 'daily', channel: '', outcome: 'online', expected: ''}
          - {quality: 'daily', channel: '9.0', outcome: 'online', expected: ''}
    steps:
      - uses: actions/checkout@v4
      - name: Isolate the .NET install directory
        shell: bash
        run: |
          dir="$RUNNER_TEMP/dotnet-isolated"
          rm -rf "$dir" && mkdir -p "$dir"
          echo "DOTNET_INSTALL_DIR=$dir" >> "$GITHUB_ENV"
      - name: Preinstall GA SDKs only
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: |
            8.0.412
            9.0.308
      - id: run
        continue-on-error: true
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: latest
          dotnet-channel: ${{ matrix.channel }}
          dotnet-quality: ${{ matrix.quality }}
          check-latest: false
      - shell: pwsh
        run: |
          $v = '${{ steps.run.outputs.dotnet-version }}'
          Write-Host "outcome=${{ steps.run.outcome }} resolved='$v'"
          if ('${{ matrix.outcome }}' -eq 'reuse') {
            if ($v -ne '${{ matrix.expected }}') {
              Write-Host "::error::Expected reuse of '${{ matrix.expected }}' but got '$v'"
              exit 1
            }
          }
          else {
            if ($v -in @('8.0.412','9.0.308')) {
              Write-Host "::error::A ${{ matrix.quality }} request reused a GA SDK ($v)"
              exit 1
            }
          }

  # ===================================================================
  # dotnet-channel is only forwarded when the version is 'latest'.
  # With any other version it is warned about and dropped - and that must
  # not disturb the reuse path.
  # ===================================================================
  channel-ignored-without-latest:
    name: "channel '${{ matrix.channel }}' with version '${{ matrix.version }}'"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {version: '8.0.412', channel: 'STS'}
          - {version: '8.0.412', channel: 'LTS'}
          - {version: '8.0.412', channel: '9.0'}
          - {version: '8.0.x', channel: '9.0'}
          # invalid channel only WARNS when the version is not 'latest'
          - {version: '8.0.412', channel: 'nonsense'}
    steps:
      - uses: actions/checkout@v4
      - name: Isolate the .NET install directory
        shell: bash
        run: |
          dir="$RUNNER_TEMP/dotnet-isolated"
          rm -rf "$dir" && mkdir -p "$dir"
          echo "DOTNET_INSTALL_DIR=$dir" >> "$GITHUB_ENV"
      - uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with: {dotnet-version: '8.0.412'}
      - id: run
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: ${{ matrix.version }}
          dotnet-channel: ${{ matrix.channel }}
          check-latest: false
      - shell: pwsh
        run: |
          if ('${{ steps.run.outputs.dotnet-version }}' -ne '8.0.412') {
            Write-Host "::error::A dropped channel disturbed the reuse path"
            exit 1
          }
          Write-Host "OK - channel ignored, local SDK reused"

  # ===================================================================
  # 'latest' mixed with concrete versions in a multiline input.
  # The channel applies only to the 'latest' entry.
  # ===================================================================
  latest-inside-multiline-versions:
    name: 'multiline: latest + pinned'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Isolate the .NET install directory
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dotnet-isolated'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "DOTNET_INSTALL_DIR=$dir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: |
            8.0.412
            9.0.308
      - id: before
        shell: pwsh
        run: |
          $c = ((& dotnet --list-sdks) | Measure-Object).Count
          "count=$c" | Out-File $env:GITHUB_OUTPUT -Append
      - id: run
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: |
            latest
            9.0.308
          dotnet-channel: '8.0'
          check-latest: false
      - name: Both entries must resolve locally, nothing downloaded
        shell: pwsh
        run: |
          $sdks = (& dotnet --list-sdks) | ForEach-Object { ($_ -split ' ')[0] }
          Write-Host "inventory: $($sdks -join ', ')"
          Write-Host "output (last installed): '${{ steps.run.outputs.dotnet-version }}'"
          if ($sdks.Count -ne [int]'${{ steps.before.outputs.count }}') {
            Write-Host "::error::Something was downloaded"; exit 1
          }

  # ===================================================================
  # The default (check-latest: true) must keep resolving 'latest' online,
  # exactly as before this feature existed.
  # ===================================================================
  latest-default-still-goes-online:
    name: 'default true: latest + ${{ matrix.channel || "(none)" }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: ['', 'LTS', 'STS', '8.0', '8.0.4xx']
    steps:
      - uses: actions/checkout@v4
      - name: Isolate the .NET install directory
        shell: bash
        run: |
          dir="$RUNNER_TEMP/dotnet-isolated"
          rm -rf "$dir" && mkdir -p "$dir"
          echo "DOTNET_INSTALL_DIR=$dir" >> "$GITHUB_ENV"
      - name: Preinstall a deliberately stale 8.0
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with: {dotnet-version: '8.0.100'}
      - id: before
        shell: pwsh
        run: |
          $c = ((& dotnet --list-sdks) | Measure-Object).Count
          "count=$c" | Out-File $env:GITHUB_OUTPUT -Append
      - id: run
        name: No check-latest input at all
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: latest
          dotnet-channel: ${{ matrix.channel }}
      - shell: pwsh
        run: |
          $sdks = (& dotnet --list-sdks) | ForEach-Object { ($_ -split ' ')[0] }
          Write-Host "resolved: '${{ steps.run.outputs.dotnet-version }}'"
          Write-Host "inventory: $($sdks -join ', ')"
          if ('${{ steps.run.outputs.dotnet-version }}' -eq '8.0.100') {
            Write-Host "::error::Default behaviour changed - it reused the stale SDK"
            exit 1
          }
          if ($sdks.Count -le [int]'${{ steps.before.outputs.count }}') {
            Write-Host "::error::Nothing was downloaded on the default path"
            exit 1
          }
