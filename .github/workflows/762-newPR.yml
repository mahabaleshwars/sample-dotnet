name: check-latest test

on:
  workflow_dispatch:

jobs:
  test-check-latest-false:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Clear preinstalled dotnet
        shell: pwsh
        run: |
          $paths = @{
            Linux   = @("/usr/share/dotnet")
            macOS   = @("$env:HOME/.dotnet")
            Windows = @("$env:ProgramFiles\dotnet", "$env:LocalAppData\Microsoft\dotnet")
          }
          foreach ($p in $paths['${{ runner.os }}']) {
            if (Test-Path $p) {
              Move-Item -Path $p -Destination ("$p-" + [IO.Path]::GetRandomFileName())
            }
          }
      - name: Setup dotnet 9.0.100
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest-input
        with:
          dotnet-version: '9.0.100'
      - name: Setup dotnet 9.0.1xx with check-latest false
        id: reuse
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest-input
        with:
          dotnet-version: '9.0.1xx'
          check-latest: false
      - name: Verify reuse
        shell: pwsh
        run: |
          if ('${{ steps.reuse.outputs.dotnet-version }}' -ne '9.0.100') {
            throw "Expected 9.0.100 to be reused, got '${{ steps.reuse.outputs.dotnet-version }}'."
          }
