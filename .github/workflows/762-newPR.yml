name: check-latest test

on:
  workflow_dispatch:

jobs:
  test-check-latest-false:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Clear toolcache
        shell: pwsh
        run: __tests__/clear-toolcache.ps1 ${{ runner.os }}
      # An older 9.0 patch: resolving '9.0' online would return a newer one.
      - name: Preinstall 9.0.100
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest-input
        with:
          dotnet-version: '9.0.100'
      - name: Request 9.0 with check-latest false
        id: reuse
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest-input
        with:
          dotnet-version: '9.0'
          check-latest: false
      - name: Verify dotnet
        shell: pwsh
        run: |
          if ('${{ steps.reuse.outputs.dotnet-version }}' -ne '9.0.100') {
            throw "Expected 9.0.100 to be reused, got '${{ steps.reuse.outputs.dotnet-version }}'."
          }
          __tests__/verify-dotnet.ps1 -Patterns "^9\.0\.100$"
