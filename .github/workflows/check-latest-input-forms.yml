name: 'check-latest: input forms and offline proof'

on:
  workflow_dispatch:
  
env:
  DOTNET_MULTILEVEL_LOOKUP: '0'
  DOTNET_NOLOGO: '1'

jobs:
  accepted-boolean-spellings:
    name: "value '${{ matrix.value }}' -> ${{ matrix.expect }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {value: 'true', expect: 'download'}
          - {value: 'True', expect: 'download'}
          - {value: 'TRUE', expect: 'download'}
          - {value: 'false', expect: 'reuse'}
          - {value: 'False', expect: 'reuse'}
          - {value: 'FALSE', expect: 'reuse'}
    steps:
      - uses: actions/checkout@v4

      # Runner images ship .NET preinstalled, which would otherwise satisfy the
      # 8.0.x request with a newer patch and make 'reuse' indistinguishable
      # from 'download'.
      - name: Isolate the .NET install directory
        shell: bash
        run: |
          dir="$RUNNER_TEMP/dotnet-isolated"
          rm -rf "$dir" && mkdir -p "$dir"
          echo "DOTNET_INSTALL_DIR=$dir" >> "$GITHUB_ENV"

      - name: Preinstall a deliberately stale baseline
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with: {dotnet-version: '8.0.404'}

      - name: Verify isolation
        shell: pwsh
        run: |
          $sdks = (& dotnet --list-sdks) | ForEach-Object { ($_ -split ' ')[0] }
          Write-Host "local: $($sdks -join ', ')"
          if ($sdks.Count -ne 1 -or $sdks[0] -ne '8.0.404') {
            Write-Host "::error::Isolation failed - expected only 8.0.404"; exit 1
          }

      - id: run
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: '8.0.x'
          check-latest: ${{ matrix.value }}

      - shell: pwsh
        run: |
          $v = '${{ steps.run.outputs.dotnet-version }}'
          $reused = ($v -eq '8.0.404')
          Write-Host "resolved=$v reused=$reused"
          if ('${{ matrix.expect }}' -eq 'reuse'    -and -not $reused) { Write-Host "::error::expected reuse";    exit 1 }
          if ('${{ matrix.expect }}' -eq 'download' -and      $reused) { Write-Host "::error::expected download"; exit 1 }

  rejected-boolean-spellings:
    name: "value '${{ matrix.value }}' must fail"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        value: ['yes', 'no', '1', '0', 'off', 'maybe', '']
    steps:
      - uses: actions/checkout@v4
      - id: bad
        continue-on-error: true
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: '8.0.x'
          check-latest: ${{ matrix.value }}
      - shell: pwsh
        run: |
          if ('${{ steps.bad.outcome }}' -ne 'failure') {
            Write-Host "::warning::'${{ matrix.value }}' was accepted - confirm this is intended"
          } else {
            Write-Host "OK - rejected"
          }

  # The headline claim: with check-latest:false and a matching local SDK,
  # the action makes no outbound calls at all.
  offline-proof:
    name: 'zero network calls / ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Isolate the .NET install directory
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dotnet-isolated'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "DOTNET_INSTALL_DIR=$dir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Preinstall while the network is available
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with: {dotnet-version: '8.0.404'}

      - name: Reuse with all egress pointed at a dead proxy
        id: offline
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: '8.0.x'
          check-latest: false
        env:
          # Port 9 is the discard port - nothing is listening, so any HTTP(S)
          # attempt fails immediately. If the action tries to reach the release
          # index or the CDN, this step dies.
          #
          # Only the lowercase spellings are set: GitHub Actions treats env keys
          # case-insensitively, so declaring both cases is a duplicate-key error.
          # Lowercase is also correct - curl ignores uppercase HTTP_PROXY by
          # design, Windows env vars are case-insensitive, and
          # @actions/http-client checks both spellings.
          http_proxy: http://127.0.0.1:9
          https_proxy: http://127.0.0.1:9
          no_proxy: ''

      - name: Assert reuse happened despite no connectivity
        shell: pwsh
        run: |
          if ('${{ steps.offline.outputs.dotnet-version }}' -ne '8.0.404') {
            Write-Host "::error::Offline reuse failed"; exit 1
          }
          dotnet --version

  offline-negative-control:
    name: 'same setup with check-latest:true must fail offline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Isolate the .NET install directory
        shell: bash
        run: |
          dir="$RUNNER_TEMP/dotnet-isolated"
          rm -rf "$dir" && mkdir -p "$dir"
          echo "DOTNET_INSTALL_DIR=$dir" >> "$GITHUB_ENV"
      - uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with: {dotnet-version: '8.0.404'}
      - id: online
        continue-on-error: true
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: '8.0.x'
          check-latest: true
        env:
          http_proxy: http://127.0.0.1:9
          https_proxy: http://127.0.0.1:9
          no_proxy: ''
      - name: This proves the offline job above was a real test
        shell: pwsh
        run: |
          Write-Host "outcome=${{ steps.online.outcome }}"
          if ('${{ steps.online.outcome }}' -ne 'failure') {
            Write-Host "::warning::check-latest:true survived the dead proxy - the offline proof may be weaker than intended"
          }

  timing-signal:
    name: 'reuse should be near-instant'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Isolate the .NET install directory
        shell: bash
        run: |
          dir="$RUNNER_TEMP/dotnet-isolated"
          rm -rf "$dir" && mkdir -p "$dir"
          echo "DOTNET_INSTALL_DIR=$dir" >> "$GITHUB_ENV"
      - uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with: {dotnet-version: '8.0.404'}
      - id: t1
        shell: pwsh
        run: '"t=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" | Out-File $env:GITHUB_OUTPUT -Append'
      - id: run
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: '8.0.x'
          check-latest: false
      - shell: pwsh
        run: |
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [int]'${{ steps.t1.outputs.t }}'
          Write-Host "reuse path took ${elapsed}s, resolved '${{ steps.run.outputs.dotnet-version }}'"
          if ('${{ steps.run.outputs.dotnet-version }}' -ne '8.0.404') {
            Write-Host "::error::Did not reuse - the timing number is meaningless"; exit 1
          }
          if ($elapsed -gt 20) {
            Write-Host "::warning::Reuse took ${elapsed}s - suspiciously slow for a no-network path"
          }
