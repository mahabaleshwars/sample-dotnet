name: 'check-latest: reuse preconditions'

on:
  workflow_dispatch:

env:
  ACTION: mahabaleshwars/setup-dotnet@feature/762-check-latest
  DOTNET_MULTILEVEL_LOOKUP: '0'
  DOTNET_NOLOGO: '1'

jobs:
  # =================================================================
  # Guard 1: the global.json rollForward floor
  # =================================================================
  floor-blocks-older-sdk:
    name: 'floor blocks older / ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Runner images ship .NET preinstalled. Redirect the action at a fresh
      # empty directory so the "locally installed" inventory is exactly what
      # this job puts there.
      - name: Isolate the .NET install directory
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dotnet-isolated'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "DOTNET_INSTALL_DIR=$dir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "DOTNET_INSTALL_DIR=$dir"

      - name: Local SDK is 8.0.404
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with: {dotnet-version: '8.0.404'}

      - name: Verify isolation
        shell: pwsh
        run: |
          $sdks = (& dotnet --list-sdks) | ForEach-Object { ($_ -split ' ')[0] }
          Write-Host "local: $($sdks -join ', ')"
          if ($sdks.Count -ne 1 -or $sdks[0] -ne '8.0.404') {
            Write-Host "::error::Isolation failed - expected only 8.0.404"; exit 1
          }

      - name: global.json demands at least 8.0.412
        shell: bash
        run: printf '{"sdk":{"version":"8.0.412","rollForward":"latestFeature"}}' > global.json

      - id: run
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with: {check-latest: false}

      - name: Assert the floor was respected AND the CLI agrees
        shell: pwsh
        run: |
          $v = '${{ steps.run.outputs.dotnet-version }}'
          Write-Host "resolved: $v"
          if ([version]$v -lt [version]'8.0.412') {
            Write-Host "::error::Reused an SDK below the global.json floor"; exit 1
          }
          # The real regression this guards against: the action reports success
          # but the CLI then refuses to run.
          dotnet --version

  floor-allows-equal-and-newer:
    name: 'floor allows ${{ matrix.label }} / ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - {local: '8.0.412', floor: '8.0.412', label: 'exactly at the floor'}
          - {local: '8.0.412', floor: '8.0.404', label: 'above the floor'}
    steps:
      - uses: actions/checkout@v4
      - name: Isolate the .NET install directory
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dotnet-isolated'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "DOTNET_INSTALL_DIR=$dir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with: {dotnet-version: '${{ matrix.local }}'}
      - shell: bash
        run: printf '{"sdk":{"version":"${{ matrix.floor }}","rollForward":"latestFeature"}}' > global.json
      - id: before
        shell: pwsh
        run: |
          $sdks = (& dotnet --list-sdks) | ForEach-Object { ($_ -split ' ')[0] }
          "count=$($sdks.Count)" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "before: $($sdks -join ', ')"
      - id: run
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with: {check-latest: false}
      - shell: pwsh
        run: |
          $sdks = (& dotnet --list-sdks) | ForEach-Object { ($_ -split ' ')[0] }
          Write-Host "after: $($sdks -join ', ')"
          if ($sdks.Count -ne [int]'${{ steps.before.outputs.count }}') {
            Write-Host "::error::'${{ matrix.label }}' should have been reused"; exit 1
          }
          if ('${{ steps.run.outputs.dotnet-version }}' -ne '${{ matrix.local }}') {
            Write-Host "::error::Expected ${{ matrix.local }}"; exit 1
          }
          dotnet --version

  floor-across-rollforward-policies:
    name: 'rollForward=${{ matrix.policy }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        policy:
          [
            disable,
            patch,
            feature,
            minor,
            major,
            latestPatch,
            latestFeature,
            latestMinor,
            latestMajor
          ]
    steps:
      - uses: actions/checkout@v4
      - name: Isolate the .NET install directory
        shell: bash
        run: |
          dir="$RUNNER_TEMP/dotnet-isolated"
          rm -rf "$dir" && mkdir -p "$dir"
          echo "DOTNET_INSTALL_DIR=$dir" >> "$GITHUB_ENV"
      - name: Local SDK sits below the declared version
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with: {dotnet-version: '8.0.404'}
      - shell: bash
        run: printf '{"sdk":{"version":"8.0.412","rollForward":"${{ matrix.policy }}"}}' > global.json
      - id: run
        continue-on-error: true
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with: {check-latest: false}
      - shell: pwsh
        run: |
          Write-Host "outcome=${{ steps.run.outcome }} resolved='${{ steps.run.outputs.dotnet-version }}'"
          if ('${{ steps.run.outputs.dotnet-version }}' -eq '8.0.404') {
            Write-Host "::error::rollForward=${{ matrix.policy }} let a below-floor SDK through"
            exit 1
          }
          dotnet --list-sdks

  global-json-exact-pin-reuses:
    name: 'global.json exact pin (no rollForward) reuses'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Isolate the .NET install directory
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dotnet-isolated'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "DOTNET_INSTALL_DIR=$dir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with: {dotnet-version: '8.0.404'}
      - shell: bash
        run: printf '{"sdk":{"version":"8.0.404"}}' > global.json
      - id: run
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with: {check-latest: false}
      - shell: pwsh
        run: |
          if ('${{ steps.run.outputs.dotnet-version }}' -ne '8.0.404') {
            Write-Host "::error::Exact global.json pin was not reused"; exit 1
          }
          dotnet --version

  global-json-custom-path-with-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Isolate the .NET install directory
        shell: bash
        run: |
          dir="$RUNNER_TEMP/dotnet-isolated"
          rm -rf "$dir" && mkdir -p "$dir"
          echo "DOTNET_INSTALL_DIR=$dir" >> "$GITHUB_ENV"
      - uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with: {dotnet-version: '8.0.404'}
      - shell: bash
        run: |
          mkdir -p build/config
          printf '{"sdk":{"version":"8.0.412","rollForward":"latestFeature"}}' > build/config/global.json
      - id: run
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          global-json-file: build/config/global.json
          check-latest: false
      - shell: pwsh
        run: |
          if ([version]'${{ steps.run.outputs.dotnet-version }}' -lt [version]'8.0.412') {
            Write-Host "::error::Floor from a custom global.json path was ignored"; exit 1
          }

  # =================================================================
  # Guard 2: dotnet-quality
  # =================================================================
  quality-ga-will-not-reuse-prerelease:
    name: 'GA request ignores a local prerelease / ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Isolate the .NET install directory
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dotnet-isolated'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "DOTNET_INSTALL_DIR=$dir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install a prerelease SDK only
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: '10.0'
          dotnet-quality: preview
      - name: Confirm the precondition
        shell: pwsh
        run: |
          $sdks = (& dotnet --list-sdks) | ForEach-Object { ($_ -split ' ')[0] }
          Write-Host "local: $($sdks -join ', ')"
          if (-not ($sdks | Where-Object { $_ -match '-' })) {
            Write-Host "::notice::No prerelease available today - this job is inconclusive"
          }
      - id: run
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: '10.0'
          dotnet-quality: ga
          check-latest: false
      - shell: pwsh
        run: |
          if ('${{ steps.run.outputs.dotnet-version }}' -match '-') {
            Write-Host "::error::A GA request reused a prerelease SDK"; exit 1
          }

  quality-preview-will-not-reuse-ga:
    name: '${{ matrix.quality }} request ignores a local GA / ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        quality: [preview, daily]
    steps:
      - uses: actions/checkout@v4
      - name: Isolate the .NET install directory
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dotnet-isolated'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "DOTNET_INSTALL_DIR=$dir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install a GA SDK only
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with: {dotnet-version: '8.0.404'}
      - id: run
        continue-on-error: true
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: '8.0'
          dotnet-quality: ${{ matrix.quality }}
          check-latest: false
      - shell: pwsh
        run: |
          if ('${{ steps.run.outputs.dotnet-version }}' -eq '8.0.404') {
            Write-Host "::error::A ${{ matrix.quality }} request reused a GA SDK"; exit 1
          }

  quality-ga-reuses-ga:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Isolate the .NET install directory
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dotnet-isolated'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "DOTNET_INSTALL_DIR=$dir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with: {dotnet-version: '8.0.404'}
      - id: run
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: '8.0'
          dotnet-quality: ga
          check-latest: false
      - shell: pwsh
        run: |
          if ('${{ steps.run.outputs.dotnet-version }}' -ne '8.0.404') {
            Write-Host "::error::GA + GA should have reused"; exit 1
          }

  # =================================================================
  # Guard 3: the dotnet muxer must exist next to the SDK folders
  # =================================================================
  # Deleting the muxer and re-requesting the SAME pinned version is a dead end:
  # install-dotnet sees sdk/8.0.404 on disk, reports "already installed" and
  # exits, so the muxer is never restored. Requesting a floating spec gives a
  # clean signal instead - with the guard working the action goes online and
  # lands a NEWER 8.0 patch; without it, it would have reused 8.0.404.
  missing-muxer-forces-online:
    name: 'broken install / ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Isolate the .NET install directory
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dotnet-isolated'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "DOTNET_INSTALL_DIR=$dir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with: {dotnet-version: '8.0.404'}
      - name: Simulate a half-removed installation
        shell: pwsh
        run: |
          $root = $env:DOTNET_ROOT
          $muxer = if ($IsWindows) { Join-Path $root 'dotnet.exe' } else { Join-Path $root 'dotnet' }
          Write-Host "Removing muxer at $muxer (SDK folders stay behind)"
          Remove-Item $muxer -Force
          Get-ChildItem (Join-Path $root 'sdk')
      - id: run
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: '8.0.x'
          check-latest: false
      - name: Assert the guard forced an online install
        shell: pwsh
        run: |
          $v = '${{ steps.run.outputs.dotnet-version }}'
          Write-Host "resolved: $v"
          if ($v -eq '8.0.404') {
            Write-Host "::error::Reuse was reported even though the CLI was missing"; exit 1
          }
          & dotnet --version

  empty-sdk-directory-forces-online:
    name: 'pristine install dir / ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Point at an empty install dir with nothing preinstalled
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dotnet-pristine'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "DOTNET_INSTALL_DIR=$dir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - id: run
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: '8.0.404'
          check-latest: false
      - shell: pwsh
        run: |
          if ('${{ steps.run.outputs.dotnet-version }}' -ne '8.0.404') {
            Write-Host "::error::Expected a clean online install"; exit 1
          }
          dotnet --version

  symlinked-sdk-folder-is-reused:
    name: 'symlinked SDK dir (container-image pattern) / ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Isolate the .NET install directory
        shell: bash
        run: |
          dir="$RUNNER_TEMP/dotnet-isolated"
          rm -rf "$dir" && mkdir -p "$dir"
          echo "DOTNET_INSTALL_DIR=$dir" >> "$GITHUB_ENV"
      - uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with: {dotnet-version: '8.0.404'}
      - name: Replace the SDK folder with a symlink to a relocated copy
        shell: bash
        run: |
          set -eux
          ROOT="$DOTNET_ROOT"
          mkdir -p "$HOME/relocated"
          mv "$ROOT/sdk/8.0.404" "$HOME/relocated/8.0.404"
          ln -s "$HOME/relocated/8.0.404" "$ROOT/sdk/8.0.404"
          ls -la "$ROOT/sdk"
      - id: run
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: '8.0.x'
          check-latest: false
      - shell: pwsh
        run: |
          if ('${{ steps.run.outputs.dotnet-version }}' -ne '8.0.404') {
            Write-Host "::error::A symlinked SDK folder was not recognised"; exit 1
          }

  # =================================================================
  # Guard 4: cross-architecture requests always install online
  # =================================================================
  cross-arch-ignores-check-latest:
    name: 'cross-arch ${{ matrix.arch }} / ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, arch: arm64}
          - {os: windows-latest, arch: x86}
          - {os: macos-latest, arch: x64}
    steps:
      - uses: actions/checkout@v4
      - name: Isolate the .NET install directory
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dotnet-isolated'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "DOTNET_INSTALL_DIR=$dir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ISOLATED_DIR=$dir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with: {dotnet-version: '8.0.404'}
      - id: run
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: '8.0.404'
          architecture: ${{ matrix.arch }}
          check-latest: false
      - name: Assert it installed into the arch-specific subdirectory
        shell: pwsh
        run: |
          # DOTNET_ROOT stays the base dir; cross-arch installs land in
          # <DOTNET_INSTALL_DIR>/<architecture> via --install-dir.
          $archDir = Join-Path $env:ISOLATED_DIR '${{ matrix.arch }}'
          Write-Host "checking $archDir"
          if (-not (Test-Path (Join-Path $archDir 'sdk'))) {
            Get-ChildItem $env:ISOLATED_DIR
            Write-Host "::error::check-latest:false short-circuited a cross-arch request"
            exit 1
          }
          Get-ChildItem (Join-Path $archDir 'sdk')

  native-arch-still-reuses:
    name: 'explicit native arch still reuses / ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, arch: x64}
          - {os: windows-latest, arch: x64}
          - {os: macos-latest, arch: arm64}
          - {os: macos-15-intel, arch: x64}
    steps:
      - uses: actions/checkout@v4
      - name: Isolate the .NET install directory
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dotnet-isolated'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "DOTNET_INSTALL_DIR=$dir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: '8.0.404'
          architecture: ${{ matrix.arch }}
      - id: run
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: '8.0.x'
          architecture: ${{ matrix.arch }}
          check-latest: false
      - shell: pwsh
        run: |
          if ('${{ steps.run.outputs.dotnet-version }}' -ne '8.0.404') {
            Write-Host "::error::An explicitly-native architecture blocked reuse"; exit 1
          }

  # =================================================================
  # Guard 5: unparseable input must still be a hard error
  # =================================================================
  invalid-spec-still-errors-with-check-latest-false:
    name: 'invalid spec must still fail: ${{ matrix.version }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['8.0.1XX', '8.0.0.0', 'abc', '8.', '8.0.42x']
    steps:
      - uses: actions/checkout@v4
      - name: Isolate the .NET install directory
        shell: bash
        run: |
          dir="$RUNNER_TEMP/dotnet-isolated"
          rm -rf "$dir" && mkdir -p "$dir"
          echo "DOTNET_INSTALL_DIR=$dir" >> "$GITHUB_ENV"
      - name: Make a tempting local SDK available
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with: {dotnet-version: '8.0.404'}
      - id: bad
        continue-on-error: true
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: ${{ matrix.version }}
          check-latest: false
      - name: check-latest must not turn a hard error into a silent success
        shell: pwsh
        run: |
          if ('${{ steps.bad.outcome }}' -ne 'failure') {
            Write-Host "::error::'${{ matrix.version }}' was accepted with check-latest:false"
            exit 1
          }
          if ('${{ steps.bad.outputs.dotnet-version }}' -eq '8.0.404') {
            Write-Host "::error::An invalid spec matched a local SDK"; exit 1
          }
          Write-Host "OK - rejected as expected"
