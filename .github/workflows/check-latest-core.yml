name: 'check-latest: core decision matrix'

on:
  workflow_dispatch:

env:
  BASELINE: '8.0.404'
  DOTNET_MULTILEVEL_LOOKUP: '0'
  DOTNET_NOLOGO: '1'

jobs:
  reuse-expected:
    name: 'reuse: ${{ matrix.spec }} / ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-22.04
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-latest
          - macos-15-intel
        spec:
          ['8.0.404', '8.0', '8.0.x', '8.0.X', '8.0.*', '8.0.4xx', '8', '8.x', '8.X', '8.*', '  8.0.x  ', 'latest']
    steps:
      - uses: actions/checkout@v4

      # The runner images ship .NET preinstalled. Point the action at a fresh
      # empty directory so the "locally installed" inventory is exactly what
      # this job puts there - otherwise a preinstalled 8.0.4xx wins the match.
      - name: Isolate the .NET install directory
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dotnet-isolated'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "DOTNET_INSTALL_DIR=$dir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Preinstall baseline
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: ${{ env.BASELINE }}

      - name: Snapshot SDK inventory
        id: before
        shell: pwsh
        run: |
          $sdks = (& dotnet --list-sdks) | ForEach-Object { ($_ -split ' ')[0] }
          "count=$($sdks.Count)" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "before: $($sdks -join ', ')"
          if ($sdks.Count -ne 1 -or $sdks[0] -ne '${{ env.BASELINE }}') {
            Write-Host "::error::Isolation failed - expected only ${{ env.BASELINE }}"
            exit 1
          }

      - name: Request '${{ matrix.spec }}' with check-latest false
        id: run
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: ${{ matrix.spec }}
          check-latest: false

      - name: Assert the local SDK was reused
        shell: pwsh
        run: |
          $sdks = (& dotnet --list-sdks) | ForEach-Object { ($_ -split ' ')[0] }
          Write-Host "after : $($sdks -join ', ')"
          Write-Host "output: '${{ steps.run.outputs.dotnet-version }}'"
          if ($sdks.Count -ne [int]'${{ steps.before.outputs.count }}') {
            Write-Host "::error::An SDK was downloaded - reuse did not happen"; exit 1
          }
          if ('${{ steps.run.outputs.dotnet-version }}' -ne '${{ env.BASELINE }}') {
            Write-Host "::error::Expected ${{ env.BASELINE }}"; exit 1
          }
          dotnet --version

  default-still-downloads:
    name: 'default true: ${{ matrix.spec }} / ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        spec: ['8.0', '8.0.x', '8.0.4xx', '8', '8.x']
    steps:
      - uses: actions/checkout@v4
      - name: Isolate the .NET install directory
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dotnet-isolated'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "DOTNET_INSTALL_DIR=$dir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with: {dotnet-version: '${{ env.BASELINE }}'}
      - id: run
        name: No check-latest input - must behave exactly as before
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: ${{ matrix.spec }}
      - shell: pwsh
        run: |
          $sdks = (& dotnet --list-sdks) | ForEach-Object { ($_ -split ' ')[0] }
          Write-Host "after: $($sdks -join ', ')"
          if ($sdks.Count -lt 2) {
            Write-Host "::error::Default behaviour changed - nothing downloaded"; exit 1
          }
          if ('${{ steps.run.outputs.dotnet-version }}' -eq '${{ env.BASELINE }}') {
            Write-Host "::error::Default resolved to the stale baseline"; exit 1
          }

  explicit-true-equals-default:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Isolate the .NET install directory
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dotnet-isolated'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "DOTNET_INSTALL_DIR=$dir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with: {dotnet-version: '${{ env.BASELINE }}'}
      - id: run
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: '8.0.x'
          check-latest: true
      - shell: pwsh
        run: |
          if ('${{ steps.run.outputs.dotnet-version }}' -eq '${{ env.BASELINE }}') {
            Write-Host "::error::check-latest:true reused a local SDK"; exit 1
          }

  fallback-expected:
    name: 'fallback: ${{ matrix.label }} / ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - {label: 'bare wildcard x', version: 'x', channel: ''}
          - {label: 'bare wildcard X', version: 'X', channel: ''}
          - {label: 'bare wildcard *', version: '*', channel: ''}
          - {label: 'latest + LTS', version: 'latest', channel: 'LTS'}
          - {label: 'latest + STS', version: 'latest', channel: 'STS'}
          - {label: 'different major', version: '9.0.x', channel: ''}
          - {label: 'different minor', version: '8.1.x', channel: ''}
          - {label: 'unmatched band', version: '8.0.1xx', channel: ''}
          - {label: 'newer patch pin', version: '8.0.412', channel: ''}
    steps:
      - uses: actions/checkout@v4
      - name: Isolate the .NET install directory
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dotnet-isolated'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "DOTNET_INSTALL_DIR=$dir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with: {dotnet-version: '${{ env.BASELINE }}'}
      - id: run
        continue-on-error: true
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: ${{ matrix.version }}
          dotnet-channel: ${{ matrix.channel }}
          check-latest: false
      - name: Assert it did NOT silently reuse the baseline
        shell: pwsh
        run: |
          $sdks = (& dotnet --list-sdks) | ForEach-Object { ($_ -split ' ')[0] }
          Write-Host "outcome=${{ steps.run.outcome }} after=$($sdks -join ', ')"
          if ('${{ steps.run.outputs.dotnet-version }}' -eq '${{ env.BASELINE }}') {
            Write-Host "::error::'${{ matrix.label }}' wrongly reused the baseline"; exit 1
          }

  latest-with-concrete-channel:
    name: 'latest + ${{ matrix.channel }} / ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        channel: ['8.0', '8.0.4xx']
    steps:
      - uses: actions/checkout@v4
      - name: Isolate the .NET install directory
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dotnet-isolated'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "DOTNET_INSTALL_DIR=$dir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install both an 8.0 and a 9.0 SDK
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: |
            ${{ env.BASELINE }}
            9.0.308
      - id: run
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: latest
          dotnet-channel: ${{ matrix.channel }}
          check-latest: false
      - shell: pwsh
        run: |
          $v = '${{ steps.run.outputs.dotnet-version }}'
          Write-Host "resolved: $v"
          if ($v -ne '${{ env.BASELINE }}') {
            Write-Host "::error::Expected the 8.0 channel to win, got '$v'"; exit 1
          }

  channel-less-latest-picks-highest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Isolate the .NET install directory
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dotnet-isolated'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "DOTNET_INSTALL_DIR=$dir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: |
            ${{ env.BASELINE }}
            9.0.308
      - id: run
        uses: mahabaleshwars/setup-dotnet@feature/762-check-latest
        with:
          dotnet-version: latest
          check-latest: false
      - shell: pwsh
        run: |
          if ('${{ steps.run.outputs.dotnet-version }}' -ne '9.0.308') {
            Write-Host "::error::channel-less latest should pick the highest local SDK"; exit 1
          }
